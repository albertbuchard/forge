name: Release Forge Memory

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-forge-memory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag points at main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit on origin/main." >&2
            exit 1
          }

      - name: Resolve release version
        id: release_meta
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "${RELEASE_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Unsupported forge-memory release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: "packages/forge-memory/package-lock.json"

      - name: Set up Safe Chain
        run: ./scripts/setup-safe-chain-ci.sh

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Install Forge Memory dependencies
        working-directory: packages/forge-memory
        run: npm ci

      - name: Verify package version matches tag
        working-directory: packages/forge-memory
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.release_version }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (packageJson.version !== process.env.RELEASE_VERSION) {
            console.error(
              `forge-memory package.json version ${packageJson.version} does not match tag ${process.env.RELEASE_VERSION}.`
            );
            process.exit(1);
          }
          NODE

      - name: Test Forge Memory
        working-directory: packages/forge-memory
        run: npm test

      - name: Pack Forge Memory
        working-directory: packages/forge-memory
        run: npm pack

      - name: Smoke packed CLI
        working-directory: packages/forge-memory
        run: |
          npm exec --yes --package ./forge-memory-${{ steps.release_meta.outputs.release_version }}.tgz -- forge-memory --help
          npm exec --yes --package ./forge-memory-${{ steps.release_meta.outputs.release_version }}.tgz -- forge-memory --version

      - name: Publish Forge Memory to npm
        working-directory: packages/forge-memory
        run: npm publish --access public
