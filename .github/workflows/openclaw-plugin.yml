name: OpenClaw Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/openclaw-plugin.yml"
      - ".github/workflows/people-sharing-release-gate.yml"
      - ".github/workflows/release-forge-memory.yml"
      - ".github/workflows/release-hermes-plugin.yml"
      - ".github/workflows/release-ios-companion.yml"
      - ".github/workflows/release-openclaw-plugin.yml"
      - "packages/companion-iroh/**"
      - "packages/forge-peer/**"
      - "packages/forge-memory/lib/native-source-manifest.mjs"
      - "packages/forge-memory/lib/peer-runtime-install.mjs"
      - "packages/forge-memory/tests/native-source-manifest.test.mjs"
      - "packages/forge-memory/tests/native-source-signing-key.test.mjs"
      - "packages/forge-memory/tests/peer-runtime-install.test.mjs"
      - "plugins/openclaw/**"
      - "scripts/ci/setup-safe-chain-ci.sh"
      - "apps/web/src/openclaw/**"
      - "apps/api/src/app.ts"
      - "apps/api/src/app.test.ts"
      - "apps/api/src/openapi.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/ci/check-people-sharing-*.mjs"
      - "scripts/ci/check-public-release-privacy*.mjs"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/openclaw-plugin.yml"
      - ".github/workflows/people-sharing-release-gate.yml"
      - ".github/workflows/release-forge-memory.yml"
      - ".github/workflows/release-hermes-plugin.yml"
      - ".github/workflows/release-ios-companion.yml"
      - ".github/workflows/release-openclaw-plugin.yml"
      - "packages/companion-iroh/**"
      - "packages/forge-peer/**"
      - "packages/forge-memory/lib/native-source-manifest.mjs"
      - "packages/forge-memory/lib/peer-runtime-install.mjs"
      - "packages/forge-memory/tests/native-source-manifest.test.mjs"
      - "packages/forge-memory/tests/native-source-signing-key.test.mjs"
      - "packages/forge-memory/tests/peer-runtime-install.test.mjs"
      - "plugins/openclaw/**"
      - "scripts/ci/setup-safe-chain-ci.sh"
      - "apps/web/src/openclaw/**"
      - "apps/api/src/app.ts"
      - "apps/api/src/app.test.ts"
      - "apps/api/src/openapi.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/ci/check-people-sharing-*.mjs"
      - "scripts/ci/check-public-release-privacy*.mjs"

permissions:
  contents: read

concurrency:
  group: openclaw-plugin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  people-release-gate:
    name: Canonical People release gate
    permissions:
      contents: read
    uses: ./.github/workflows/people-sharing-release-gate.yml
    with:
      release: false
      source_sha: ${{ github.sha }}

  plugin:
    needs: people-release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Safe Chain
        run: ./scripts/ci/setup-safe-chain-ci.sh
      - run: npm ci
      - run: node --test packages/forge-memory/tests/native-source-manifest.test.mjs packages/forge-memory/tests/native-source-signing-key.test.mjs packages/forge-memory/tests/peer-runtime-install.test.mjs
      - run: npm exec -- vitest run apps/web/src/openclaw/parity.test.ts apps/web/src/openclaw/index.test.ts apps/web/src/openclaw/api-client.test.ts apps/web/src/openclaw/manifest.test.ts
      - run: npm run build:openclaw-plugin
