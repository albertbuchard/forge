name: OpenClaw Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/openclaw-plugin.yml"
      - "packages/companion-iroh/**"
      - "plugins/openclaw/**"
      - "scripts/ci/setup-safe-chain-ci.sh"
      - "apps/web/src/openclaw/**"
      - "apps/api/src/app.ts"
      - "apps/api/src/app.test.ts"
      - "apps/api/src/openapi.ts"
      - "package.json"
  pull_request:
    paths:
      - ".github/workflows/openclaw-plugin.yml"
      - "packages/companion-iroh/**"
      - "plugins/openclaw/**"
      - "scripts/ci/setup-safe-chain-ci.sh"
      - "apps/web/src/openclaw/**"
      - "apps/api/src/app.ts"
      - "apps/api/src/app.test.ts"
      - "apps/api/src/openapi.ts"
      - "package.json"

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Safe Chain
        run: ./scripts/ci/setup-safe-chain-ci.sh
      - run: npm ci
      - run: npm exec -- vitest run apps/web/src/openclaw/parity.test.ts apps/web/src/openclaw/index.test.ts apps/web/src/openclaw/api-client.test.ts apps/web/src/openclaw/manifest.test.ts
      - run: npm run build:openclaw-plugin
