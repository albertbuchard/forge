name: Build isolated Forge public demo

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag, for example demo-0.3.55
        required: true
        type: string
      publish_image:
        description: Push the reviewed image to GitHub Container Registry
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: forge-public-demo-${{ inputs.image_tag }}
  cancel-in-progress: false

jobs:
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        if: inputs.publish_image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the isolated demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/demo-runtime/Dockerfile
          push: ${{ inputs.publish_image }}
          tags: ghcr.io/${{ github.repository_owner }}/forge-public-demo:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record deployment boundary
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PUBLISH_IMAGE: ${{ inputs.publish_image }}
        run: |
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/forge-public-demo:${IMAGE_TAG}"
            echo "published=${PUBLISH_IMAGE}"
            echo "required_runtime_secret=FORGE_DEMO_SESSION_SECRET"
            echo "network_boundary=TLS reverse proxy required; gateway binds port 4400"
            echo "session_boundary=20 concurrent sessions; 30 minute maximum; 15 minute idle"
          } | tee forge-public-demo-receipt.txt

      - uses: actions/upload-artifact@v4
        with:
          name: forge-public-demo-${{ inputs.image_tag }}-receipt
          path: forge-public-demo-receipt.txt
          retention-days: 14
