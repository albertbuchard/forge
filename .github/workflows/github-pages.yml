name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "apps/api/src/**"
      - "docs/reference/user-stories-and-use-cases.md"
      - "scripts/docs/export-openapi-docs.ts"
      - "scripts/docs/generate-user-stories-page.mjs"
      - "scripts/docs/generate-user-stories-page.test.mjs"
      - "scripts/ci/setup-safe-chain-ci.sh"
      - "plugins/openclaw/docs/**"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Safe Chain
        run: ./scripts/ci/setup-safe-chain-ci.sh
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run docs:openapi
      - run: npm run test:docs:user-stories
      - run: npm run docs:user-stories:check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./plugins/openclaw/docs
      - id: deployment
        uses: actions/deploy-pages@v4
