name: Release Forge Hermes Plugin

on:
  push:
    tags:
      - "hermes-v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Exact Forge Hermes semver to publish"
        required: true
        type: string

concurrency:
  group: release-hermes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  people-release-gate:
    name: Canonical People release gate
    permissions:
      contents: read
    uses: ./.github/workflows/people-sharing-release-gate.yml
    with:
      release: true
      source_sha: ${{ github.sha }}
    secrets:
      FORGE_NATIVE_SOURCE_ED25519_PRIVATE_KEY: ${{ secrets.FORGE_NATIVE_SOURCE_ED25519_PRIVATE_KEY }}

  build:
    needs: people-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Verify admitted source commit
        env:
          VALIDATED_SHA: ${{ needs.people-release-gate.outputs.validated_sha }}
        run: test "${VALIDATED_SHA}" = "${GITHUB_SHA}"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag points at main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit on origin/main." >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Safe Chain
        run: ./scripts/ci/setup-safe-chain-ci.sh

      - name: Install dependencies
        run: npm ci

      - name: Prepare native source signing key
        env:
          FORGE_NATIVE_SOURCE_ED25519_PRIVATE_KEY: ${{ secrets.FORGE_NATIVE_SOURCE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FORGE_NATIVE_SOURCE_ED25519_PRIVATE_KEY}" ]; then
            echo "FORGE_NATIVE_SOURCE_ED25519_PRIVATE_KEY is required for release." >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "${FORGE_NATIVE_SOURCE_ED25519_PRIVATE_KEY}" > "${RUNNER_TEMP}/forge-native-source-ed25519-v1.pem"
          chmod 600 "${RUNNER_TEMP}/forge-native-source-ed25519-v1.pem"

      - name: Build and verify release artifacts from tag
        env:
          RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}
          FORGE_NATIVE_SOURCE_SIGNING_KEY_PATH: ${{ runner.temp }}/forge-native-source-ed25519-v1.pem
          FORGE_REQUIRE_SIGNED_NATIVE_SOURCE: "1"
        run: |
          FORGE_RELEASE_MODE=publish-from-tag \
          FORGE_RELEASE_SKIP_UPLOAD=1 \
            ./scripts/release/release-forge-hermes-plugin.sh "${RELEASE_VERSION#hermes-v}"

      - name: Remove native source signing key
        if: always()
        run: |
          key_path="${RUNNER_TEMP}/forge-native-source-ed25519-v1.pem"
          if [ -f "${key_path}" ]; then
            shred --remove "${key_path}" 2>/dev/null || rm -f "${key_path}"
          fi

      - name: Upload PyPI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-hermes-python-dist
          path: plugins/hermes/python-dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/forge-hermes-plugin

    steps:
      - name: Download PyPI artifacts
        uses: actions/download-artifact@v4
        with:
          name: forge-hermes-python-dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
