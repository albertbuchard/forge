name: Release Forge OpenClaw Plugin

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-openclaw-${{ github.ref }}
  cancel-in-progress: false

jobs:
  companion-iroh-binaries:
    name: Build Forge Iroh binary (${{ matrix.platform-key }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            platform-key: linux-x64
            binary-name: forge-companion-iroh
          - os: macos-15
            rust-target: aarch64-apple-darwin
            platform-key: darwin-arm64
            binary-name: forge-companion-iroh
          - os: macos-15
            rust-target: x86_64-apple-darwin
            platform-key: darwin-x64
            binary-name: forge-companion-iroh
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            platform-key: win32-x64
            binary-name: forge-companion-iroh.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Build Forge Iroh host
        shell: bash
        run: |
          cargo build \
            --release \
            --manifest-path companion-iroh/Cargo.toml \
            --bin forge-companion-iroh \
            --target "${{ matrix.rust-target }}"

      - name: Stage binary artifact
        shell: bash
        run: |
          mkdir -p "artifact/companion-iroh/${{ matrix.platform-key }}"
          cp \
            "companion-iroh/target/${{ matrix.rust-target }}/release/${{ matrix.binary-name }}" \
            "artifact/companion-iroh/${{ matrix.platform-key }}/${{ matrix.binary-name }}"
          chmod 755 "artifact/companion-iroh/${{ matrix.platform-key }}/${{ matrix.binary-name }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-companion-iroh-${{ matrix.platform-key }}
          path: artifact
          if-no-files-found: error

  publish:
    needs: companion-iroh-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag points at main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit on origin/main." >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Safe Chain
        run: ./scripts/setup-safe-chain-ci.sh

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Download Forge Iroh binaries
        uses: actions/download-artifact@v4
        with:
          pattern: forge-companion-iroh-*
          path: openclaw-plugin/prebuilt-companion-iroh
          merge-multiple: true

      - name: Publish release from tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          FORGE_COMPANION_IROH_PREBUILT_DIR: openclaw-plugin/prebuilt-companion-iroh
        run: |
          FORGE_RELEASE_MODE=publish-from-tag \
            ./scripts/release-forge-openclaw-plugin.sh "${RELEASE_VERSION#v}"
