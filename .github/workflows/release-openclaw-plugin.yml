name: Release Forge OpenClaw Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Exact Forge OpenClaw semver to publish"
        required: true
        type: string

concurrency:
  group: release-openclaw-${{ github.ref }}
  cancel-in-progress: false

jobs:
  people-release-gate:
    name: Canonical People release gate
    permissions:
      contents: read
    uses: ./.github/workflows/people-sharing-release-gate.yml
    with:
      release: true
      source_sha: ${{ github.sha }}
    secrets:
      FORGE_NATIVE_SOURCE_ED25519_PRIVATE_KEY: ${{ secrets.FORGE_NATIVE_SOURCE_ED25519_PRIVATE_KEY }}

  publish:
    needs: people-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Verify admitted source commit
        env:
          VALIDATED_SHA: ${{ needs.people-release-gate.outputs.validated_sha }}
        run: test "${VALIDATED_SHA}" = "${GITHUB_SHA}"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag points at main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit on origin/main." >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Safe Chain
        run: ./scripts/ci/setup-safe-chain-ci.sh

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Harden local-owner verification path
        run: |
          python3 - <<'PY'
          import os
          import stat

          home = os.environ["HOME"]
          metadata = os.lstat(home)
          if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISDIR(metadata.st_mode):
              raise SystemExit("GitHub runner HOME must be a real directory.")
          if metadata.st_uid != os.getuid():
              raise SystemExit("GitHub runner HOME is not owned by the current runner.")
          os.chmod(home, metadata.st_mode & ~0o022)
          hardened = os.lstat(home)
          if hardened.st_mode & 0o022:
              raise SystemExit("GitHub runner HOME remains group- or other-writable.")
          PY

      - name: Prepare native source signing key
        env:
          FORGE_NATIVE_SOURCE_ED25519_PRIVATE_KEY: ${{ secrets.FORGE_NATIVE_SOURCE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FORGE_NATIVE_SOURCE_ED25519_PRIVATE_KEY}" ]; then
            echo "FORGE_NATIVE_SOURCE_ED25519_PRIVATE_KEY is required for release." >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "${FORGE_NATIVE_SOURCE_ED25519_PRIVATE_KEY}" > "${RUNNER_TEMP}/forge-native-source-ed25519-v1.pem"
          chmod 600 "${RUNNER_TEMP}/forge-native-source-ed25519-v1.pem"

      - name: Publish release from tag
        env:
          RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}
          FORGE_COMPANION_IROH_PACKAGE_MODE: source-only
          FORGE_NATIVE_SOURCE_SIGNING_KEY_PATH: ${{ runner.temp }}/forge-native-source-ed25519-v1.pem
          FORGE_REQUIRE_SIGNED_NATIVE_SOURCE: "1"
        run: |
          FORGE_RELEASE_MODE=publish-from-tag \
            ./scripts/release/release-forge-openclaw-plugin.sh "${RELEASE_VERSION#v}"

      - name: Remove native source signing key
        if: always()
        run: |
          key_path="${RUNNER_TEMP}/forge-native-source-ed25519-v1.pem"
          if [ -f "${key_path}" ]; then
            shred --remove "${key_path}" 2>/dev/null || rm -f "${key_path}"
          fi
