name: Windows owner authentication

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-owner-auth.yml"
      - "packages/forge-memory/bin/forge-memory.mjs"
      - "packages/forge-memory/lib/pairing-payload-file.mjs"
      - "packages/forge-memory/lib/windows-owner-auth.mjs"
      - "packages/forge-memory/tests/pairing-payload-file.test.mjs"
      - "packages/forge-memory/tests/runtime-mutation.test.mjs"
      - "packages/forge-memory/tests/windows-owner-auth.test.mjs"
      - "apps/api/src/security/application-security-runtime.ts"
      - "apps/api/src/security/local-owner-session-coordinator.ts"
      - "apps/web/src/openclaw/local-owner-client.ts"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/windows-owner-auth.yml"
      - "packages/forge-memory/bin/forge-memory.mjs"
      - "packages/forge-memory/lib/pairing-payload-file.mjs"
      - "packages/forge-memory/lib/windows-owner-auth.mjs"
      - "packages/forge-memory/tests/pairing-payload-file.test.mjs"
      - "packages/forge-memory/tests/runtime-mutation.test.mjs"
      - "packages/forge-memory/tests/windows-owner-auth.test.mjs"
      - "apps/api/src/security/application-security-runtime.ts"
      - "apps/api/src/security/local-owner-session-coordinator.ts"
      - "apps/web/src/openclaw/local-owner-client.ts"

permissions:
  contents: read

concurrency:
  group: windows-owner-auth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows ${{ matrix.windows }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.windows }}
    timeout-minutes: 20
    env:
      FORGE_WINDOWS_CLI_HOME: ${{ github.workspace }}\.windows owner cli home
      FORGE_WINDOWS_CLI_DATA_ROOT: ${{ github.workspace }}\.windows-owner-cli-data
      FORGE_WINDOWS_FIXTURE_ROOT: ${{ github.workspace }}\.windows-owner-cross-user-fixture
      FORGE_WINDOWS_CREDENTIAL_PATH: ${{ github.workspace }}\.windows-owner-cross-user-fixture\forge-root\native\windows-owner.json
    strategy:
      fail-fast: false
      matrix:
        windows:
          - windows-2022
          - windows-2025
        node:
          - "22.14.0"
          - "24.18.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/forge-memory/package-lock.json

      - name: Install Forge Memory dependencies
        working-directory: packages/forge-memory
        run: npm ci --ignore-scripts

      - name: Exercise Windows-compatible package tests
        working-directory: packages/forge-memory
        run: |
          node --test --test-concurrency=1 `
            ./tests/macos-browser-handler.test.mjs `
            ./tests/native-source-manifest.test.mjs `
            ./tests/native-source-signing-key.test.mjs `
            ./tests/pairing-payload-file.test.mjs `
            ./tests/remote-pairing.test.mjs `
            ./tests/runtime-mutation.test.mjs `
            ./tests/windows-owner-auth.test.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "Forge Windows-compatible package tests failed"
          }

      - name: Prove the supported CLI prepares reusable owner-only material
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cli = Join-Path $env:GITHUB_WORKSPACE "packages\forge-memory\bin\forge-memory.mjs"
          New-Item -ItemType Directory -Path $env:FORGE_WINDOWS_CLI_HOME -Force | Out-Null
          New-Item -ItemType Directory -Path $env:FORGE_WINDOWS_CLI_DATA_ROOT -Force | Out-Null
          $env:HOME = $env:FORGE_WINDOWS_CLI_HOME
          $env:USERPROFILE = $env:FORGE_WINDOWS_CLI_HOME

          node $cli install `
            --yes `
            --no-start `
            --no-doctor `
            --skip-pair-ios `
            --adapters none `
            --data-root $env:FORGE_WINDOWS_CLI_DATA_ROOT `
            --port 4317 `
            --json | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Forge could not prepare the isolated Windows CLI configuration"
          }

          $firstUrl = node $cli ui --no-start --print-url
          if ($LASTEXITCODE -ne 0 -or $firstUrl.Trim() -ne "http://127.0.0.1:4317/forge/") {
            throw "Forge could not prepare the supported Windows local-owner CLI path"
          }

          $descriptorPath = Join-Path $env:FORGE_WINDOWS_CLI_HOME ".forge\native\windows-owner.json"
          $keyPath = Join-Path $env:FORGE_WINDOWS_CLI_HOME ".forge\native\windows-owner.key"
          if (
            -not (Test-Path -LiteralPath $descriptorPath -PathType Leaf) -or
            -not (Test-Path -LiteralPath $keyPath -PathType Leaf)
          ) {
            throw "Forge did not create the expected Windows owner descriptor and key"
          }

          function Assert-CurrentOwnerOnly {
            param([Parameter(Mandatory = $true)][string]$Path)
            $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            $acl = Get-Acl -LiteralPath $Path
            $owner = ([Security.Principal.NTAccount]$acl.Owner).Translate(
              [Security.Principal.SecurityIdentifier]
            ).Value
            $rules = @($acl.Access)
            $bad = @(
              $rules | Where-Object {
                $_.AccessControlType -ne [Security.AccessControl.AccessControlType]::Allow -or
                $_.IsInherited -or
                $_.IdentityReference.Translate(
                  [Security.Principal.SecurityIdentifier]
                ).Value -ne $sid
              }
            )
            $full = [Security.AccessControl.FileSystemRights]::FullControl
            $ownerFull = @(
              $rules | Where-Object { ($_.FileSystemRights -band $full) -eq $full }
            )
            if (
              $owner -ne $sid -or
              -not $acl.AreAccessRulesProtected -or
              $rules.Count -lt 1 -or
              $bad.Count -ne 0 -or
              $ownerFull.Count -lt 1
            ) {
              throw "Forge owner material is not restricted to the current Windows owner: $Path"
            }
          }

          Assert-CurrentOwnerOnly (Split-Path -Parent $keyPath)
          Assert-CurrentOwnerOnly $descriptorPath
          Assert-CurrentOwnerOnly $keyPath

          $descriptor = Get-Content -LiteralPath $descriptorPath -Raw | ConvertFrom-Json
          $expectedKeyPath = [IO.Path]::GetFullPath($keyPath)
          if (
            $descriptor.schemaVersion -ne 1 -or
            [IO.Path]::GetFullPath([string]$descriptor.keyPath) -ne $expectedKeyPath
          ) {
            throw "Forge wrote an invalid Windows owner descriptor"
          }
          $keyHashBefore = (Get-FileHash -LiteralPath $keyPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $descriptorHashBefore = (Get-FileHash -LiteralPath $descriptorPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ([string]$descriptor.keySha256 -ne $keyHashBefore) {
            throw "Forge Windows owner descriptor does not bind the installed key"
          }

          $env:FORGE_WINDOWS_CLI_KEY_PATH = $keyPath
          node --input-type=module -e "import fs from 'node:fs'; const value=fs.readFileSync(process.env.FORGE_WINDOWS_CLI_KEY_PATH,'utf8').trim(); if(!/^[A-Za-z0-9_-]{43}$/.test(value)||Buffer.from(value,'base64url').byteLength!==32) throw new Error('invalid Windows owner key');"
          if ($LASTEXITCODE -ne 0) {
            throw "Forge did not create a 256-bit Windows owner key"
          }

          $secondUrl = node $cli ui --no-start --print-url
          if ($LASTEXITCODE -ne 0 -or $secondUrl.Trim() -ne $firstUrl.Trim()) {
            throw "Forge could not reuse the supported Windows local-owner CLI path"
          }
          $keyHashAfter = (Get-FileHash -LiteralPath $keyPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $descriptorHashAfter = (Get-FileHash -LiteralPath $descriptorPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if (
            $keyHashAfter -ne $keyHashBefore -or
            $descriptorHashAfter -ne $descriptorHashBefore
          ) {
            throw "Forge unexpectedly rotated reusable Windows owner material"
          }

      - name: Install the web client test runtime
        if: matrix.windows == 'windows-2025' && matrix.node == '24.18.0'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove the Windows web client consumes the protected owner key
        if: matrix.windows == 'windows-2025' && matrix.node == '24.18.0'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $descriptorPath = Join-Path $env:FORGE_WINDOWS_CLI_HOME ".forge\native\windows-owner.json"
          $keyPath = Join-Path $env:FORGE_WINDOWS_CLI_HOME ".forge\native\windows-owner.key"
          $env:FORGE_WINDOWS_CLIENT_DESCRIPTOR = $descriptorPath
          $env:FORGE_WINDOWS_CLIENT_KEY = $keyPath
          $consumerCheck = @'
          import fs from "node:fs";
          import { resolvePlatformOwnerKey } from "./apps/web/src/openclaw/local-owner-client.ts";
          const actual = resolvePlatformOwnerKey(process.env.FORGE_WINDOWS_CLIENT_DESCRIPTOR);
          const expected = Buffer.from(fs.readFileSync(process.env.FORGE_WINDOWS_CLIENT_KEY, "utf8").trim(), "base64url");
          try {
            if (!actual || actual.byteLength !== 32 || !actual.equals(expected)) {
              throw new Error("Forge's Windows web client could not consume the protected owner key.");
            }
          } finally {
            actual?.fill(0);
            expected.fill(0);
          }
          '@
          node --import tsx --input-type=module --eval $consumerCheck
          if ($LASTEXITCODE -ne 0) {
            throw "Forge's supported Windows web client owner path failed"
          }

      - name: Prove another local account cannot read CLI or DPAPI owner material
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:FORGE_WINDOWS_FIXTURE_ROOT | Out-Null
          $controlPath = Join-Path $env:FORGE_WINDOWS_FIXTURE_ROOT "readable-control.txt"
          Set-Content -LiteralPath $controlPath -Value "cross-user-control" -Encoding UTF8
          $currentSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls.exe $env:FORGE_WINDOWS_FIXTURE_ROOT /inheritance:r /grant:r "*${currentSid}:(OI)(CI)(F)" "*S-1-5-32-545:(OI)(CI)(RX)" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Forge could not prepare a traversable synthetic fixture root"
          }
          $cliDescriptorPath = Join-Path $env:FORGE_WINDOWS_CLI_HOME ".forge\native\windows-owner.json"
          $cliKeyPath = Join-Path $env:FORGE_WINDOWS_CLI_HOME ".forge\native\windows-owner.key"
          if (
            -not (Test-Path -LiteralPath $cliDescriptorPath -PathType Leaf) -or
            -not (Test-Path -LiteralPath $cliKeyPath -PathType Leaf)
          ) {
            throw "Forge could not find the isolated CLI owner material"
          }
          node --input-type=module -e "import { ensureWindowsOwnerCredential } from './packages/forge-memory/lib/windows-owner-auth.mjs'; await ensureWindowsOwnerCredential({ credentialPath: process.env.FORGE_WINDOWS_CREDENTIAL_PATH });"
          if ($LASTEXITCODE -ne 0) {
            throw "Forge could not prepare the synthetic Windows owner credential"
          }

          $testUser = "forge-ci-" + ([Guid]::NewGuid().ToString("N").Substring(0, 8))
          $passwordText = "F0rge!" + [Guid]::NewGuid().ToString("N") + "aA1"
          $securePassword = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $credential = [PSCredential]::new(".\$testUser", $securePassword)
          $helperPath = Join-Path $env:GITHUB_WORKSPACE ".windows-owner-cross-user-check.ps1"
          $publicCopy = Join-Path $env:GITHUB_WORKSPACE ".windows-owner-public-copy.json"
          @'
          param(
            [Parameter(Mandatory = $true)][string]$CredentialPath,
            [Parameter(Mandatory = $true)][string]$ControlPath,
            [Parameter(Mandatory = $true)][string]$PublicCopy,
            [Parameter(Mandatory = $true)][string]$CliDescriptorPath,
            [Parameter(Mandatory = $true)][string]$CliKeyPath
          )
          $ErrorActionPreference = "Stop"
          if ((Get-Content -LiteralPath $ControlPath -Raw).Trim() -ne "cross-user-control") {
            exit 42
          }
          foreach ($entry in @(
            @{ Path = $CredentialPath; ExitCode = 40 },
            @{ Path = $CliDescriptorPath; ExitCode = 43 },
            @{ Path = $CliKeyPath; ExitCode = 44 }
          )) {
            $readWasDenied = $false
            try {
              $stream = [IO.File]::Open(
                $entry.Path,
                [IO.FileMode]::Open,
                [IO.FileAccess]::Read,
                [IO.FileShare]::ReadWrite
              )
              try {
                [void]$stream.ReadByte()
              } finally {
                $stream.Dispose()
              }
            } catch {
              $failure = $_.Exception
              while ($null -ne $failure) {
                if (
                  $failure -is [System.UnauthorizedAccessException] -or
                  $failure -is [System.Security.SecurityException]
                ) {
                  $readWasDenied = $true
                  break
                }
                $failure = $failure.InnerException
              }
              if (-not $readWasDenied) {
                throw
              }
            }
            if (-not $readWasDenied) {
              exit $entry.ExitCode
            }
          }
          $record = Get-Content -LiteralPath $PublicCopy -Raw | ConvertFrom-Json
          $protected = [Convert]::FromBase64String($record.protectedKey)
          $entropy = [Text.Encoding]::UTF8.GetBytes("forge/windows-owner-auth/v2")
          [void][Reflection.Assembly]::Load(
            "System.Security, Version=4.0.0.0, Culture=neutral, PublicKeyToken=b03f5f7f11d50a3a"
          )
          try {
            [void][Security.Cryptography.ProtectedData]::Unprotect(
              $protected,
              $entropy,
              [Security.Cryptography.DataProtectionScope]::CurrentUser
            )
            exit 41
          } catch {
            $failure = $_.Exception
            while ($null -ne $failure) {
              if ($failure -is [Security.Cryptography.CryptographicException]) {
                exit 0
              }
              $failure = $failure.InnerException
            }
            throw
          }
          '@ | Set-Content -LiteralPath $helperPath -Encoding UTF8

          New-LocalUser -Name $testUser -Password $securePassword -PasswordNeverExpires | Out-Null
          try {
            Copy-Item -LiteralPath $env:FORGE_WINDOWS_CREDENTIAL_PATH -Destination $publicCopy
            & icacls.exe $publicCopy /inheritance:r /grant "*S-1-5-32-545:(R)" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Forge could not prepare the synthetic public ciphertext copy"
            }
            $powershell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
            $process = Start-Process `
              -FilePath $powershell `
              -ArgumentList @(
                "-NoLogo",
                "-NoProfile",
                "-NonInteractive",
                "-ExecutionPolicy",
                "Bypass",
                "-File",
                "`"$helperPath`"",
                "`"$($env:FORGE_WINDOWS_CREDENTIAL_PATH)`"",
                "`"$controlPath`"",
                "`"$publicCopy`"",
                "`"$cliDescriptorPath`"",
                "`"$cliKeyPath`""
              ) `
              -Credential $credential `
              -LoadUserProfile `
              -Wait `
              -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Cross-user Windows owner isolation failed with exit $($process.ExitCode)"
            }
          } finally {
            Remove-LocalUser -Name $testUser -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $helperPath, $publicCopy -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $env:FORGE_WINDOWS_FIXTURE_ROOT -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $env:FORGE_WINDOWS_CLI_HOME -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $env:FORGE_WINDOWS_CLI_DATA_ROOT -Recurse -Force -ErrorAction SilentlyContinue
            $passwordText = $null
            $securePassword = $null
            $credential = $null
          }

      - name: Verify the publication package contains the Windows owner module
        working-directory: packages/forge-memory
        shell: pwsh
        run: |
          $pack = npm pack --dry-run --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "npm pack --dry-run failed"
          }
          $paths = @($pack[0].files | ForEach-Object { $_.path })
          if ($paths -notcontains "lib/windows-owner-auth.mjs") {
            throw "The forge-memory package omitted lib/windows-owner-auth.mjs"
          }
          if ($paths | Where-Object { $_ -match '(^|/)windows-owner\.(key|credential|json)$' }) {
            throw "The forge-memory package contains generated owner credential material"
          }
