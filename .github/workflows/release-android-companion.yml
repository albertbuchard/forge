name: Release signed Forge Android companion

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Human-readable release name for the signed bundle
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: forge-android-${{ inputs.release_name }}
  cancel-in-progress: false

jobs:
  signed-bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"

      - name: Require Android signing authority
        shell: bash
        env:
          FORGE_ANDROID_KEYSTORE_BASE64: ${{ secrets.FORGE_ANDROID_KEYSTORE_BASE64 }}
          FORGE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FORGE_ANDROID_KEYSTORE_PASSWORD }}
          FORGE_ANDROID_KEY_ALIAS: ${{ secrets.FORGE_ANDROID_KEY_ALIAS }}
          FORGE_ANDROID_KEY_PASSWORD: ${{ secrets.FORGE_ANDROID_KEY_PASSWORD }}
        run: |
          for name in FORGE_ANDROID_KEYSTORE_BASE64 FORGE_ANDROID_KEYSTORE_PASSWORD FORGE_ANDROID_KEY_ALIAS FORGE_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing Android release authority: ${name}" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$FORGE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/forge-android-release.jks"

      - name: Build signed release bundle
        working-directory: apps/android-companion
        env:
          FORGE_ANDROID_KEYSTORE: ${{ runner.temp }}/forge-android-release.jks
          FORGE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FORGE_ANDROID_KEYSTORE_PASSWORD }}
          FORGE_ANDROID_KEY_ALIAS: ${{ secrets.FORGE_ANDROID_KEY_ALIAS }}
          FORGE_ANDROID_KEY_PASSWORD: ${{ secrets.FORGE_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace bundleRelease

      - name: Preserve signed bundle for Play Console review
        uses: actions/upload-artifact@v4
        with:
          name: forge-android-${{ inputs.release_name }}
          path: apps/android-companion/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
