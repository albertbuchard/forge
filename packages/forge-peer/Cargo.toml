[package]
name = "forge-peer"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
publish = false
description = "Transport-independent Forge peer protocol core and daemon"

[lib]
name = "forge_peer"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "forge-peer"
path = "src/bin/forge-peer.rs"

[dependencies]
async-trait = "0.1.89"
arc-swap = "1.7.1"
base64 = "0.22.1"
bincode = { version = "2.0.1", features = ["derive"] }
blake3 = "1.8.2"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.50", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "zeroize"] }
hex = "0.4.3"
iroh = "=1.0.2"
openmls = { version = "=0.8.1", features = ["openmls_rust_crypto"] }
openmls_memory_storage = "=0.5.0"
openmls_rust_crypto = "=0.5.1"
openmls_traits = "=0.5.0"
rand = "0.9.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.9"
sha3 = "0.10.8"
subtle = "2.6.1"
thiserror = "2.0.17"
time = { version = "0.3.53", features = ["formatting", "parsing"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uniffi = { version = "=0.32.0", default-features = false }
url = { version = "2.5.7", features = ["serde"] }
zeroize = { version = "1.8.2", features = ["derive"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[dev-dependencies]
proptest = "1.9.0"
rcgen = "0.14.5"
tempfile = "3.23.0"
tokio-rustls = "0.26.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
