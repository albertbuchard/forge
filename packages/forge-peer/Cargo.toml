[package]
name = "forge-peer"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
publish = false
description = "Transport-independent Forge peer protocol core and daemon"

[lib]
name = "forge_peer"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "forge-peer"
path = "src/bin/forge-peer.rs"
required-features = ["full-peer"]

[[bin]]
name = "forge-owner-broker"
path = "src/bin/forge-owner-broker.rs"
required-features = ["owner-broker"]

[features]
default = ["full-peer"]
owner-broker = []
full-peer = [
    "owner-broker",
    "dep:async-trait",
    "dep:arc-swap",
    "dep:base64",
    "dep:blake3",
    "dep:chacha20poly1305",
    "dep:ed25519-dalek",
    "dep:iroh",
    "dep:openmls",
    "dep:openmls_memory_storage",
    "dep:openmls_rust_crypto",
    "dep:openmls_traits",
    "dep:reqwest",
    "dep:semver",
    "dep:serde_json_canonicalizer",
    "dep:sha2",
    "dep:sha3",
    "dep:subtle",
    "dep:time",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:uniffi",
    "dep:x25519-dalek",
]

[dependencies]
async-trait = { version = "0.1.89", optional = true }
arc-swap = { version = "1.7.1", optional = true }
base64 = { version = "0.22.1", optional = true }
bincode = { version = "2.0.1", features = ["derive"] }
blake3 = { version = "1.8.2", optional = true }
chacha20poly1305 = { version = "0.10.1", optional = true }
clap = { version = "4.5.50", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "zeroize"], optional = true }
hex = "0.4.3"
iroh = { version = "=1.0.2", optional = true }
openmls = { git = "https://github.com/openmls/openmls.git", rev = "34222ef632c87df58baaa7614c8a72ac235c5f07", features = ["openmls_rust_crypto"], optional = true }
openmls_memory_storage = { git = "https://github.com/openmls/openmls.git", rev = "34222ef632c87df58baaa7614c8a72ac235c5f07", optional = true }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls.git", rev = "34222ef632c87df58baaa7614c8a72ac235c5f07", optional = true }
openmls_traits = { git = "https://github.com/openmls/openmls.git", rev = "34222ef632c87df58baaa7614c8a72ac235c5f07", optional = true }
rand = "0.9.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls"], optional = true }
rustix = { version = "1.1.4", features = ["fs", "process"] }
semver = { version = "1.0.27", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_json_canonicalizer = { version = "0.3.2", optional = true }
sha2 = { version = "0.10.9", optional = true }
sha3 = { version = "0.10.8", optional = true }
subtle = { version = "2.6.1", optional = true }
thiserror = "2.0.17"
time = { version = "0.3.53", features = ["formatting", "parsing"], optional = true }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "0.1.41", optional = true }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"], optional = true }
uniffi = { version = "=0.32.0", default-features = false, optional = true }
url = { version = "2.5.7", features = ["serde"] }
zeroize = { version = "1.8.2", features = ["derive"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"], optional = true }

[dev-dependencies]
proptest = "1.9.0"
rcgen = "0.14.5"
tempfile = "3.23.0"
tokio-rustls = "0.26.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
