[graph]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is a non-runtime proc macro pulled by netlink-packet-core through Iroh 1.0.2; no safe upstream upgrade exists" },
  { id = "RUSTSEC-2025-0141", reason = "bincode is not vulnerable; it defines versioned signed and durable encodings through state v9, so removal requires an explicit backward-compatible codec migration rather than an unsafe in-place substitution" },
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is compile-time-only through the libcrux-sha3 dependency of OpenMLS 0.8.1; no compatible upstream replacement exists" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
